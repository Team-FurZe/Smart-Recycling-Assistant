name: smart-recycling-assistant

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sra_user
      POSTGRES_PASSWORD: sra_pass
      POSTGRES_DB: sra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sra_user -d sra"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ../../apps/ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/yolo/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../../apps/backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: sra
      PG_USER: sra_user
      PG_PASS: sra_pass
      JWT_SECRET: change-this-secret-key-change-this-secret-key-123456
      UPLOAD_DIR: /app/uploads
      AI_URL: http://ai-service:8001
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:19006,http://10.0.2.2:8080
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
