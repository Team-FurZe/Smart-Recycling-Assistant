server:
  port: ${BACKEND_PORT:8080}
  tomcat:
    # Büyük body'lerde (ör. 10MB+) swallow limitine takılmaması için
    max-swallow-size: -1

spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:sra}
    username: ${PG_USER:sra_user}
    password: ${PG_PASS:sra_pass}
  jpa:
    hibernate:
      ddl-auto: update       # ilk aşamada tabloyu otomatik oluşturur
    show-sql: false
  servlet:
    multipart:
      # 413 hatasını önlemek için upload limitleri (ihtiyaca göre ayarlayabilirsin)
      max-file-size: 20MB
      max-request-size: 20MB

ai:
  url: ${AI_URL:http://localhost:8000}  # FastAPI servisi

cors:
  allowed-origins: "http://localhost:5173,http://10.0.2.2:5173"
